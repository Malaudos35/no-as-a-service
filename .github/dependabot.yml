version: 2

updates:
- package-ecosystem: "pip"
  directory: "/"
  schedule:
    interval: "monthly"
    day: "monday"
    time: "03:00"
    timezone: "Europe/Paris"
  open-pull-requests-limit: 2
  groups:
    python-minor-and-patch:
      applies-to: version-updates
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
    python-major:
      applies-to: version-updates
      patterns:
      - "*"
      update-types:
      - "major"
  labels:
  - "dependencies"
  - "python"

- package-ecosystem: "docker"
  directory: "/"
  schedule:
    interval: "monthly"
    day: "monday"
    time: "03:30"
    timezone: "Europe/Paris"
  open-pull-requests-limit: 1
  groups:
    docker-images:
      applies-to: version-updates
      patterns:
      - "*"
  labels:
  - "dependencies"
  - "docker"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "monthly"
    day: "monday"
    time: "04:00"
    timezone: "Europe/Paris"
  open-pull-requests-limit: 1
  groups:
    github-actions:
      applies-to: version-updates
      patterns:
      - "*"
  labels:
  - "dependencies"
  - "github-actions"
