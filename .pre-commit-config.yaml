default_language_version:
  python: python3.12

default_stages:
- pre-commit

repos:
- repo: local
  hooks:
  - id: ruff-format
    name: Ruff format
    entry: uv run ruff format
    language: system
    types: [ python ]
    pass_filenames: true

  - id: ruff-check
    name: Ruff check
    entry: uv run ruff check --fix
    language: system
    types: [ python ]
    pass_filenames: true

  - id: pytest
    name: Pytest
    entry: uv run pytest
    language: system
    pass_filenames: false
    stages:
    - pre-push

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-merge-conflict
