[project]
name = "no-as-a-service"
version = "0.1.0"
description = "No as a Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.1",
    "gunicorn==23.0.0",
    "werkzeug==3.1.3",
]

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "requests>=2.32.0",
    "ruff>=0.16.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["naas", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["naas"]
branch = true
omit = [
    "naas/wsgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@abstractmethod",
    "if TYPE_CHECKING:",
]
fail_under = 80

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["naas*"]



[tool.pytest.ini_options]


testpaths = ["tests"]

addopts = [
    "--strict-markers",
    "--strict-config",
]

markers = [
    "unit: tests unitaires",
    "functional: tests fonctionnels",
]